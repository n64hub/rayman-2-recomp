# N64Recomp's configuration for Rayman 2: The Great Escape (USA), SHA-1 50558356b059ad3fbaf5fe95380512b9dceaaf52: it
# reads the game's code out of the ROM by the symbols in syms/ (tools/gen_syms.py, from the ROM alone) and writes
# RecompiledFuncs/ (tools/recompile.sh). The code is stored raw in the ROM, so there is nothing to decompress first.
[input]
# The ROM header's entrypoint, the start of the boot segment.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/rayman2.us.syms.toml"
rom_file_path = "roms/rayman2.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# libultra's internals (its exception handler, the managers' threads, the raw SI and PI access) are N64Recomp's own
# ignored functions, by the names syms/ gives them: the runtime replaces what calls them.

# Spins. The runtime runs one game thread at a time and switches only when the running one calls into it, where a
# console's interrupts preempt any thread. The game waits for its controller thread (func_8008EF78, woken by the SI's
# messages) to finish a Controller Pak request by spinning on that thread's state byte, 0x800C8D10, until it is 0
# (func_8008EF6C reads it): each pass yields, or the controller thread never runs and the game freezes on the screen
# after it reads the pak (the "Expansion Pak detected!" screen at boot).
[[patches.hook]]
func = "func_8008F344"
before_vram = 0x8008F35C
text = "{ void yield_self(uint8_t*); if (ctx->r2 != 0) yield_self(rdram); }"

[[patches.hook]]
func = "func_800FADC8"
before_vram = 0x800FB020
text = "{ void yield_self(uint8_t*); if (ctx->r2 != 0) yield_self(rdram); }"

# Each frame the main thread waits in func_8008FAF8 for 0x800CE2C4 to be 0 and 0x800EFE70 to be 1, which the
# controller thread sets as it finishes reading the controllers: each pass that waits yields.
[[patches.hook]]
func = "func_8008FAF8"
before_vram = 0x8008FB04
text = "{ void yield_self(uint8_t*); if (ctx->r2 != 0) yield_self(rdram); }"

[[patches.hook]]
func = "func_8008FAF8"
before_vram = 0x8008FB1C
text = "{ void yield_self(uint8_t*); if (ctx->r3 != ctx->r2) yield_self(rdram); }"

# One frame a VI at most. The game's scheduler thread (func_8008F5C0) counts each retrace in 0x800C8C3C, and as a frame
# starts func_8008E944 copies that count to 0x800C8C40, which keys the frame's cache of texture loads: a texture's load
# block is written into the list once a frame, its address and the frame's count kept in the texture (+0x8, +0xC), and
# a later draw of it in the same count only calls that block (func_8009CEDC). There is one display list buffer, so a
# frame that starts in the same VI as the one before calls blocks that frame wrote where its own commands now go: a
# console's CPU never builds two frames in one VI, the recomp's does in well under a millisecond. Such a call can land
# on itself, which RT64 follows until the page runs out of memory. So a frame that would start in the VI before's count
# waits for the next retrace, as each pass yields.
[[patches.hook]]
func = "func_8008E944"
before_vram = 0x8008EA74
text = "{ void yield_self(uint8_t*); static int32_t last = -1; while (MEM_W(0, (gpr)(int32_t)0x800C8C3C) == last) yield_self(rdram); last = MEM_W(0, (gpr)(int32_t)0x800C8C3C); MEM_W(0, (gpr)(int32_t)0x800C8C40) = last; }"

# The sound engine's queue of calls (func_800B273C adds a function and its argument to the array at 0x800DFED4, counted
# in 0x800DFECC) has room for 0x800DFED0's count, 250, and never checks it. A synthesizer player (func_800B2794) runs
# and empties it as each audio frame is made, but it is filled at each retrace too: func_800B3338 adds the stop of
# each voice that has finished, every retrace until the stop runs. The scheduler starts no audio task while the RSP
# has a graphics task, which in the runtime lasts until RT64 has read its list, so a list that takes long to read (on
# lavapipe, RT64 building a pipeline on the CPU) makes no audio frames, and after about 84 retraces the queue runs past
# its end into the voice table the heap put after it (0x800DFEA8). The next retrace calls a voice argument there as a
# function: "Failed to find function at 0x8019B...". A console's audio never waits that long. So an addition that
# finds the queue full is dropped: those stops are added again each retrace until the queue has run.
[[patches.hook]]
func = "func_800B273C"
before_vram = 0x800B273C
text = "if (MEM_W(0, (gpr)(int32_t)0x800DFECC) >= MEM_W(0, (gpr)(int32_t)0x800DFED0)) { ctx->r2 = 1; return; }"

# A menu's backdrop clears black. Each frame func_8008DC44 clears the colour image with a fill of the viewport's colour
# (+0x7C, the level's fog: teal in the Woods of Light), or of black where 0x800C8DB3 is set (the Controller Pak's
# screens). While a menu shows its backdrop (the pause menu and its pages), a script sets 0x800C87D0, and
# func_8009496C draws the menu's opaque gradient (func_80098D58) over the whole 4:3 in place of the level's sky, so on
# a console the fill never shows. RT64 widens a fill of the whole screen to the window's edges but keeps the gradient
# and the swirl drawn over it at 4:3, so in a wide picture the fill showed either side as the level's colour. With
# 0x800C87D0 set the clear takes its black fill.
[[patches.hook]]
func = "func_8008DC44"
before_vram = 0x8008DE30
text = "if (MEM_BU(0, (gpr)(int32_t)0x800C87D0) != 0) ctx->r3 = 1;"

# Widescreen culling. func_8009989C sets a camera up for a frame: its fields of view (+0x64 across, +0x68 up), its
# projection (guPerspective) and the four planes at +0x98 that the game tests what it draws against, built for 4:3.
# RT64 widens the 3D to the window but the game left out whatever was past those planes, so in a wide picture objects
# and pieces of the level popped in and out at its sides. Every camera mode joins at 0x80099DF8 with the planes
# written, where src/game/widescreen.cpp widens the left and right ones as RT64 widens the picture (none at Original).
[[patches.hook]]
func = "func_8009989C"
before_vram = 0x80099DF8
text = "{ void r2_widen_cull_planes(uint8_t*, gpr); r2_widen_cull_planes(rdram, ctx->r16); }"

# The 2D drawer, func_8009784C, writes a scaled texture rectangle's command (at a1) from its rectangle struct (s1) at
# 0x800981FC, where src/game/widescreen.cpp makes a full-screen one (the fades) span the screen so RT64 stretches it
# across a wide picture, and keeps the tiles of a big image (the title logo's) from overlapping and their texture
# coordinates inside the tile.
[[patches.hook]]
func = "func_8009784C"
before_vram = 0x800981FC
text = "{ void r2_fix_rect(uint8_t*, gpr, gpr); r2_fix_rect(rdram, ctx->r17, ctx->r5); }"

# The sprites' clip to the screen, func_800976E0, which the 2D drawer (func_8009784C) draws one through: at its start
# src/game/widescreen.cpp draws one that reaches past a 4:3 screen's edges out to the wide picture's (none at Original)
# and returns the list's end, and the game's own clip runs for the rest.
[[patches.hook]]
func = "func_800976E0"
before_vram = 0x800976E0
text = "{ int r2_wide_sprite(uint8_t*, recomp_context*); if (r2_wide_sprite(rdram, ctx)) return; }"

# The HUD's pass, func_800BC53C: its bars and icons (until func_800BC460 returns, at 0x800BC7EC) and then its text, from
# func_800C2844, until it returns at 0x800BC824. Each bar, icon and letter is a sprite that func_80096EAC has the 2D
# drawer (func_8009784C) write at 0x80097360 (the list in a0, its rectangle in a1, the screen in a3) and that ends the
# list at 0x80097368 (v0), and func_800C2844 draws a text entry with func_800C2F48 at 0x800C29E8.
# src/game/widescreen.cpp draws the HUD from the wide picture's edges there (none at Original).
[[patches.hook]]
func = "func_800BC53C"
before_vram = 0x800BC53C
text = "{ void r2_hud_start(); r2_hud_start(); }"

[[patches.hook]]
func = "func_800BC53C"
before_vram = 0x800BC7EC
text = "{ void r2_hud_icons_end(); r2_hud_icons_end(); }"

[[patches.hook]]
func = "func_800BC53C"
before_vram = 0x800BC824
text = "{ void r2_hud_end(); r2_hud_end(); }"

[[patches.hook]]
func = "func_80096EAC"
before_vram = 0x80097360
text = "{ gpr r2_hud_sprite(uint8_t*, gpr, gpr, gpr); ctx->r4 = r2_hud_sprite(rdram, ctx->r4, ctx->r5, ctx->r7); }"

[[patches.hook]]
func = "func_80096EAC"
before_vram = 0x80097368
text = "{ gpr r2_hud_sprite_end(uint8_t*, gpr); ctx->r2 = r2_hud_sprite_end(rdram, ctx->r2); }"

[[patches.hook]]
func = "func_800C2844"
before_vram = 0x800C29E8
text = "{ void r2_hud_text_start(uint8_t*); r2_hud_text_start(rdram); }"

[[patches.hook]]
func = "func_800C2844"
before_vram = 0x800C29F0
text = "{ void r2_hud_text_end(uint8_t*); r2_hud_text_end(rdram); }"

# A menu's backdrop gradient: func_80098D58 makes each vertex's colour from its place (its x read into v0 at 0x80098EB8,
# the vertex in t0) and then writes the display list that draws them, at 0x80098FE8. src/game/widescreen.cpp spreads
# them across a wide picture there (none at Original) and gives the colours the x they had.
[[patches.hook]]
func = "func_80098D58"
before_vram = 0x80098EB8
text = "{ gpr r2_backdrop_x(uint8_t*, gpr, gpr); ctx->r2 = r2_backdrop_x(rdram, ctx->r8, ctx->r2); }"

[[patches.hook]]
func = "func_80098D58"
before_vram = 0x80098FE8
text = "{ void r2_widen_backdrop(uint8_t*); r2_widen_backdrop(rdram); }"

# The idle thread (func_800004C0, once it has started the game's threads) is a watchdog: it waits for the main thread's
# OSThread state to read 1, libultra's OS_STATE_STOPPED, and then breaks. The runtime keeps its own states in that
# field, where 1 is QUEUED, so it would break while the game runs. The runtime has no idle thread to stand in for, so
# it waits there for good and lets the other threads run.
[[patches.hook]]
func = "func_800004C0"
before_vram = 0x80000698
text = "{ void pause_self(uint8_t*); pause_self(rdram); }"
