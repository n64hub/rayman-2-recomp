# RSPRecomp's configuration for Rayman 2's audio microcode, aspMain (libultra's ABI 1). Graphics tasks go to RT64; the
# audio tasks the game sends need this microcode recompiled to run (src/main/main.cpp, get_rsp_microcode).
# tools/recompile.sh writes it into RecompiledFuncs/.
#
# - The text is the boot segment's at 0x80017E60 (ROM 0x18A60), right after rspboot, 0xE20 bytes; the game's audio
#   tasks name it as their ucode.
# - text_address is the IMEM address its first byte runs at, 0x04001080, after the boot microcode.
# - The command handlers are reached through a table in the data segment (0x8001BBA0, ROM 0x1C7A0), which RSPRecomp
#   can't find by following the instructions, so they are listed below: the data's 16 halfwords from offset 0x10. They
#   are the same as Mario Party 2's aspMain's.

rom_file_path = "roms/rayman2.us.z64"
text_offset = 0x18A60
text_size = 0xE20
text_address = 0x04001080

# C++, not C: the output includes librecomp's RSP header. CMakeLists.txt builds RecompiledFuncs/*.cpp with the game.
output_file_path = "RecompiledFuncs/aspMain_rsp.cpp"
output_function_name = "aspMain_run"

extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
